name: Test merlin

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  native-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust_toolchain: [nightly, stable]
        os: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_toolchain }}

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  cross-linux-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust_target:
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.rust_target }}

      - name: Install Cross tool
        run: |
          # Use binstall for an instant binary download instead of compiling cross from source
          cargo binstall --strategy quick-install cross -y

      - name: Build
        run: cross build --target ${{ matrix.rust_target }}

      - name: Test
        run: cross test --target ${{ matrix.rust_target }} -- --test-threads=1
