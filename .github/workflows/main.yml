name: Test merlin

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  native-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust_toolchain: [nightly, stable]
        os: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_toolchain == 'stable'

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.rust_toolchain == 'nightly'

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  cross-linux-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust_target:
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust nightly with targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.rust_target }}

      # Installs the host development multi-arch standard linkers to prevent 32-bit PowerPC toolchain crashes
      - name: Install Multi-arch Linker Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib gcc-powerpc-linux-gnu

      - name: Run Cross-Compilation Build
        uses: zijiren233/cargo-cross@v1
        with:
          command: build
          targets: ${{ matrix.rust_target }}
          toolchain: nightly

      - name: Run Cross-Compilation Tests
        uses: zijiren233/cargo-cross@v1
        with:
          command: test
          targets: ${{ matrix.rust_target }}
          toolchain: nightly
          # FIXED: Swapped deprecated 'args' input with 'cargo-args'
          cargo-args: -- --test-threads=1
