name: Test merlin

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  native-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust_toolchain: [nightly, stable]
        os: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_toolchain == 'stable'

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.rust_toolchain == 'nightly'

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  cross-linux-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust_target:
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust nightly with targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.rust_target }}

      - name: Cache Cross Binary Tool
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-cross
          key: ${{ runner.os }}-cargo-cross-binary-v1

      - name: Install Cross tool
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-cross --git https://github.com/zijiren233/cargo-cross

      - name: Cache Cargo Dependencies & Targets
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Build
        run: cargo cross build --target ${{ matrix.rust_target }}

      - name: Test
        run: cargo cross test --target ${{ matrix.rust_target }} -- --test-threads=1
