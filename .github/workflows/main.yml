name: Test merlin

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  native-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust_toolchain: [nightly, stable]
        os: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_toolchain == 'stable'

      - name: Install Rust ${{ matrix.rust_toolchain }}
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.rust_toolchain == 'nightly'

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  cross-linux-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust_target:
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust nightly with targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.rust_target }}

      - name: Run Cross-Compilation Build
        uses: zijiren233/cargo-cross@v1
        with:
          command: build
          targets: ${{ matrix.rust_target }}
          toolchain: nightly

      - name: Run Cross-Compilation Tests
        uses: zijiren233/cargo-cross@v1
        env:
          CARGO_TARGET_POWERPC_UNKNOWN_LINUX_GNU_LINKER: powerpc64-linux-gnu-gcc
          RUSTFLAGS: "-C linker=powerpc64-linux-gnu-gcc -C link-arg=-m32"
        with:
          command: test
          targets: ${{ matrix.rust_target }}
          toolchain: nightly
          cargo-args: -- --test-threads=1
