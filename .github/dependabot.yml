version: 2
updates:
  # Monitors GitHub Actions updates weekly targeting develop
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"

  # Monitors Cargo updates weekly targeting develop
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "develop" #

  # DAILY EMERGENCY MONITOR: Dedicated security channel for urgent Rust patches
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    target-branch: "develop"
